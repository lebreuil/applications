apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: authentik
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    - repoURL: https://charts.goauthentik.io
      chart: authentik
      targetRevision: "2026.8.2"
      helm:
        valueFiles:
          - $values/deploy/values.yaml

    - repoURL: https://github.com/lebreuil/authentik.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/lebreuil/authentik.git
      targetRevision: main
      path: deploy/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: authentik

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
