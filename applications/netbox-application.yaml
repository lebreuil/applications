apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: netbox
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default

  sources:
    # NetBox Helm chart from the official OCI registry.
    - repoURL: ghcr.io/netbox-community/netbox-chart
      chart: netbox
      targetRevision: "8.3.38"
      helm:
        valueFiles:
          - $values/deploy/values.yaml

    # Helm values and namespace-local secret resources.
    - repoURL: https://github.com/lebreuil/netbox.git
      targetRevision: main
      ref: values

    - repoURL: https://github.com/lebreuil/netbox.git
      targetRevision: main
      path: deploy/manifests

  destination:
    server: https://kubernetes.default.svc
    namespace: netbox

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      # The namespace is managed by Terraform.
      - CreateNamespace=false
